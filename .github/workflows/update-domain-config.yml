name: Update Domain Configuration

on:
  workflow_dispatch:
    inputs:
      frontend_domain:
        description: 'Frontend domain (e.g., xproducoeseeventos.com.br)'
        required: true
        default: 'xproducoeseeventos.com.br'
      api_domain:
        description: 'API domain (e.g., api.xproducoeseeventos.com.br)'
        required: true
        default: 'api.xproducoeseeventos.com.br'

jobs:
  update-backend-cors:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout backend
        uses: actions/checkout@v4
        with:
          repository: AlysonJean/xproducoes-backend
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update CORS configuration
        run: |
          echo "🔧 Updating CORS for domain: ${{ github.event.inputs.frontend_domain }}"
          
          # Backup do arquivo original
          if [ -f "src/config/cors.ts" ]; then
            cp src/config/cors.ts src/config/cors.ts.backup
          fi
          
          # Criar ou atualizar configuração CORS
          cat > src/config/cors.ts << 'EOF'
          import { CorsOptions } from 'cors';

          const allowedOrigins = [
            'https://${{ github.event.inputs.frontend_domain }}',
            'https://www.${{ github.event.inputs.frontend_domain }}',
            process.env.FRONTEND_URL,
            // Manter origens de desenvolvimento
            'http://localhost:5173',
            'http://localhost:3000',
            'http://127.0.0.1:5173',
          ].filter(Boolean) as string[];

          export const corsOptions: CorsOptions = {
            origin: (origin, callback) => {
              // Permitir requisições sem origin (mobile apps, curl, etc)
              if (!origin) return callback(null, true);
              
              if (allowedOrigins.indexOf(origin) !== -1) {
                callback(null, true);
              } else {
                console.warn(`CORS blocked origin: ${origin}`);
                callback(new Error('Not allowed by CORS'));
              }
            },
            credentials: true,
            methods: ['GET', 'POST', 'PUT', 'DELETE', 'PATCH', 'OPTIONS'],
            allowedHeaders: ['Content-Type', 'Authorization'],
          };
          EOF
          
          echo "✅ CORS configuration updated"

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "config: update CORS for ${{ github.event.inputs.frontend_domain }}"
          title: "Update CORS configuration for new domain"
          body: |
            ## 🌐 Domain Configuration Update
            
            This PR updates the CORS configuration to allow requests from:
            - `https://${{ github.event.inputs.frontend_domain }}`
            - `https://www.${{ github.event.inputs.frontend_domain }}`
            
            API domain: `https://${{ github.event.inputs.api_domain }}`
            
            ### Changes
            - Updated `src/config/cors.ts` with new allowed origins
            
            ### Next Steps
            1. Review and merge this PR
            2. Update Render environment variables:
               - `FRONTEND_URL=https://${{ github.event.inputs.frontend_domain }}`
               - `ALLOWED_ORIGINS=https://${{ github.event.inputs.frontend_domain }},https://www.${{ github.event.inputs.frontend_domain }}`
            3. Redeploy backend
          branch: config/update-domain-cors
          delete-branch: true

  update-frontend-env:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout frontend
        uses: actions/checkout@v4
        with:
          repository: AlysonJean/xproducoes-frontend
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update environment configuration
        run: |
          echo "🔧 Updating frontend environment for API: ${{ github.event.inputs.api_domain }}"
          
          # Criar .env.production
          cat > .env.production << EOF
          # Domain Configuration - Updated via workflow
          VITE_API_URL=https://${{ github.event.inputs.api_domain }}
          VITE_API_BASE_URL=https://${{ github.event.inputs.api_domain }}/api
          VITE_FRONTEND_URL=https://${{ github.event.inputs.frontend_domain }}
          EOF
          
          echo "✅ Frontend environment updated"
          cat .env.production

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "config: update API URL to ${{ github.event.inputs.api_domain }}"
          title: "Update API domain configuration"
          body: |
            ## 🌐 Domain Configuration Update
            
            This PR updates the frontend to use the new domain configuration:
            - **API URL:** `https://${{ github.event.inputs.api_domain }}`
            - **Frontend URL:** `https://${{ github.event.inputs.frontend_domain }}`
            
            ### Changes
            - Updated `.env.production` with new API endpoints
            
            ### Next Steps
            1. Review and merge this PR
            2. Verify Vercel environment variables match
            3. Redeploy frontend via Vercel
          branch: config/update-domain-frontend
          delete-branch: true

  notify-completion:
    runs-on: ubuntu-latest
    needs: [update-backend-cors, update-frontend-env]
    steps:
      - name: Summary
        run: |
          echo "## 🎉 Domain Configuration Update Complete!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Updated Domains:" >> $GITHUB_STEP_SUMMARY
          echo "- **Frontend:** https://${{ github.event.inputs.frontend_domain }}" >> $GITHUB_STEP_SUMMARY
          echo "- **API:** https://${{ github.event.inputs.api_domain }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Next Steps:" >> $GITHUB_STEP_SUMMARY
          echo "1. ✅ Review and merge the PRs created" >> $GITHUB_STEP_SUMMARY
          echo "2. 🔧 Update environment variables in Vercel and Render" >> $GITHUB_STEP_SUMMARY
          echo "3. 🚀 Deploy both frontend and backend" >> $GITHUB_STEP_SUMMARY
          echo "4. 🧪 Run DNS validation workflow to verify" >> $GITHUB_STEP_SUMMARY
