name: CI

# Gate real (Fase 3): antes desta mudança não havia nenhum workflow de CI neste repo
# (.github/workflows/ existia, mas vazio) — o deploy no Vercel depende só da integração
# própria da Vercel com o GitHub, que builda o app mas não roda lint nem a suíte de testes.
# Este workflow roda lint + typecheck + testes + build em todo push/PR; nenhum passo usa
# `|| true` ou `continue-on-error`, então uma falha real em qualquer um deles falha o job.
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Lint, typecheck, testes e build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run type-check

      - name: Testes (com cobertura e piso anti-regressão)
        run: npm run test:coverage

      - name: Build (inclui geração do sitemap via prebuild)
        run: npm run build
