name: Vercel Deploy (frontend)

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      target:
        description: 'preview or production'
        required: false
        default: 'preview'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build --if-present

      - name: Deploy to Vercel
        working-directory: frontend
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          echo "Triggering Vercel deploy..."
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ github.event.inputs.target }}" = "production" ]; then
              npx vercel --token $VERCEL_TOKEN --prod --confirm
            else
              npx vercel --token $VERCEL_TOKEN --confirm
            fi
          else
            if [ "${{ github.ref }}" = "refs/heads/main" ]; then
              npx vercel --token $VERCEL_TOKEN --prod --confirm
            else
              npx vercel --token $VERCEL_TOKEN --confirm
            fi
          fi
