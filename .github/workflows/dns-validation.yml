name: Validate DNS Configuration

on:
  workflow_dispatch:
  schedule:
    # Roda diariamente às 8h para verificar DNS
    - cron: '0 8 * * *'

jobs:
  validate-dns:
    runs-on: ubuntu-latest
    steps:
      - name: Check DNS records
        run: |
          echo "🔍 Validating DNS configuration for xproducoeseeventos.com.br"
          
          # Validar domínio principal
          echo "Checking root domain..."
          if host xproducoeseeventos.com.br | grep -q "76.76.21.21"; then
            echo "✅ Root domain A record is correct"
          else
            echo "❌ Root domain A record is missing or incorrect"
            echo "Expected: 76.76.21.21"
            echo "Current:"
            host xproducoeseeventos.com.br || echo "No DNS record found"
          fi
          
          # Validar www
          echo ""
          echo "Checking www subdomain..."
          if host www.xproducoeseeventos.com.br | grep -q "cname.vercel-dns.com"; then
            echo "✅ WWW CNAME is correct"
          else
            echo "⚠️ WWW CNAME might be incorrect or still propagating"
            host www.xproducoeseeventos.com.br || echo "No DNS record found"
          fi
          
          # Validar API
          echo ""
          echo "Checking api subdomain..."
          if host api.xproducoeseeventos.com.br | grep -q "onrender.com"; then
            echo "✅ API CNAME is correct"
          else
            echo "⚠️ API CNAME might be incorrect or still propagating"
            host api.xproducoeseeventos.com.br || echo "No DNS record found"
          fi
          
          echo ""
          echo "📊 DNS Validation Complete"

      - name: Check SSL certificates
        run: |
          echo "🔐 Checking SSL certificates..."
          
          # Check frontend SSL
          echo ""
          echo "Frontend SSL:"
          timeout 10 openssl s_client -connect xproducoeseeventos.com.br:443 -servername xproducoeseeventos.com.br </dev/null 2>/dev/null | openssl x509 -noout -dates 2>/dev/null || echo "⚠️ SSL not ready or domain not resolving"
          
          # Check API SSL
          echo ""
          echo "API SSL:"
          timeout 10 openssl s_client -connect api.xproducoeseeventos.com.br:443 -servername api.xproducoeseeventos.com.br </dev/null 2>/dev/null | openssl x509 -noout -dates 2>/dev/null || echo "⚠️ SSL not ready or domain not resolving"
          
          echo ""
          echo "🔒 SSL Check Complete"

      - name: Test endpoints
        run: |
          echo "🌐 Testing live endpoints..."
          
          # Test frontend
          echo ""
          echo "Frontend (https://xproducoeseeventos.com.br):"
          if curl -s -o /dev/null -w "%{http_code}" --max-time 10 https://xproducoeseeventos.com.br | grep -q "200\|301\|302"; then
            echo "✅ Frontend is responding"
          else
            echo "⚠️ Frontend is not responding or not deployed yet"
          fi
          
          # Test API
          echo ""
          echo "API (https://api.xproducoeseeventos.com.br):"
          if curl -s -o /dev/null -w "%{http_code}" --max-time 10 https://api.xproducoeseeventos.com.br/health 2>/dev/null | grep -q "200"; then
            echo "✅ API is responding"
          else
            echo "⚠️ API is not responding or not deployed yet"
          fi
          
          echo ""
          echo "✨ Endpoint tests complete"
