stages:
  - build
  - deploy

variables:
  NODE_VERSION: "18"
  VERCEL_SCOPE: "alyson-jeans-projects"

cache:
  paths:
    - node_modules/

build_frontend:
  stage: build
  image: node:${NODE_VERSION}
  script:
    - cd frontend
    - npm ci --silent
    - npm run build
  artifacts:
    paths:
      - frontend/dist/

deploy_to_vercel:
  stage: deploy
  image: node:${NODE_VERSION}
  only:
    - main
    - master
  script:
    - chmod +x frontend/ci/deploy-vercel.sh
    - frontend/ci/deploy-vercel.sh
  variables:
    # VERCEL_TOKEN must be stored in GitLab CI/CD variables (masked/protected)
    VERCEL_TOKEN: $VERCEL_TOKEN
