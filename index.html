    <!-- 🚨 GLOBAL ERROR HANDLER FOR DEBUGGING 🚨 -->
    <script>
      window.onerror = function(msg, url, line, col, error) {
        // Ignorar erros de ResizeObserver que são inofensivos
        if (msg && msg.toString().includes('ResizeObserver')) return;

        const container = document.getElementById('global-error-overlay') || document.createElement('div');
        container.id = 'global-error-overlay';
        container.style.position = 'fixed';
        container.style.top = '0';
        container.style.left = '0';
        container.style.width = '100%';
        container.style.height = '100%';
        container.style.backgroundColor = '#1a0505';
        container.style.color = '#ff4444';
        container.style.zIndex = '999999';
        container.style.padding = '20px';
        container.style.fontFamily = 'monospace';
        container.style.overflow = 'auto';
        container.style.whiteSpace = 'pre-wrap';

        const time = new Date().toLocaleTimeString();
        container.innerHTML += `\n[${time}] CRITICAL ERROR:\n${msg}\nAt: ${url}:${line}:${col}\n${error?.stack || ''}\n----------------------------------------\n`;
        
        if (!document.body.contains(container)) {
          document.body.appendChild(container);
        }
      };

      window.onunhandledrejection = function(event) {
        // Ignorar erros de ResizeObserver
        if (event.reason && event.reason.toString().includes('ResizeObserver')) return;
        
        window.onerror(
          'Unhandled Promise Rejection: ' + (event.reason?.message || event.reason),
          '', 0, 0, event.reason
        );
      };
    </script>
